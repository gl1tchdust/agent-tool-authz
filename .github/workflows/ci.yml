name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install --quiet -r requirements.txt
      - run: python -m pytest tests/ -q

  # ---------------------------------------------------------------------------
  # The measurement.
  #
  # Both halves are enforced. A block rate below the floor means an attack got
  # through; a breakage rate above zero means the policy denied legitimate
  # work, which is how a control gets switched off in production.
  #
  # Needs no model and no API key: the question is whether a call would be
  # permitted, which is decided by the policy alone.
  # ---------------------------------------------------------------------------
  benchmark:
    name: attack suite
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --quiet -r requirements.txt

      - name: Score the shipped policy
        run: |
          python -m benchmark.run \
            --cases attacks/cases.yml \
            --policy attacks/policy.yml \
            --json-out benchmark-results/score.json | tee score.txt

      - name: End-to-end injection, gate on
        run: python scripts/injection_demo.py | tee injection.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "## Attack suite"
            echo
            echo '```'
            cat score.txt 2>/dev/null || echo "(no output)"
            echo '```'
            echo
            echo "## Indirect prompt injection, end to end"
            echo
            echo '```'
            cat injection.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark
          path: |
            benchmark-results/
            score.txt
            injection.txt

  # ---------------------------------------------------------------------------
  # Detector accuracy, against real third-party code.
  #
  # Re-derives the precision and recall in the README by scanning four pinned
  # codebases and comparing to hand-labelled ground truth. A finding with no
  # label counts against precision rather than being ignored, so a new false
  # positive shows up as a drop rather than as silence.
  #
  # Read only: the corpus is cloned and parsed, never imported or executed.
  # ---------------------------------------------------------------------------
  detector:
    name: detector accuracy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --quiet -r requirements.txt

      - name: Fetch the pinned corpus
        run: ./detector/fetch_corpus.sh

      - name: Score against the labels
        run: python -m detector.measure --strict | tee detector.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "## Detector accuracy"
            echo
            echo '```'
            cat detector.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: detector
          path: detector.txt

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - run: gitleaks detect --redact --verbose
